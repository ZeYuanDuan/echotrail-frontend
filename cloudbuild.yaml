serviceAccount: projects/echotrail-dev-508500-k6/serviceAccounts/echotrail-frontend-deployer@echotrail-dev-508500-k6.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: node:24.12.0
    entrypoint: npm
    args: [ci]

  - name: node:24.12.0
    entrypoint: npm
    args: [run, lint]

  - name: node:24.12.0
    entrypoint: npm
    args: [run, type-check]

  - name: node:24.12.0
    entrypoint: npm
    args: [run, format:check]

  - name: node:24.12.0
    entrypoint: npm
    args: [test]

  - name: node:24.12.0
    entrypoint: npm
    args: [run, build]

  - name: node:24.12.0
    entrypoint: npx
    args:
      - --yes
      - firebase-tools@15.30.0
      - deploy
      - --only
      - hosting
      - --project
      - echotrail-dev-508500-k6
      - --non-interactive
      - --message
      - frontend-$COMMIT_SHA
